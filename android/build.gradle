// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def patchBlePeripheral = tasks.register('patchBlePeripheral', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/patch-ble-peripheral.mjs'
}

gradle.projectsEvaluated {
    project(':capacitor-cordova-android-plugins').tasks
        .withType(org.gradle.api.tasks.compile.JavaCompile)
        .configureEach {
            dependsOn rootProject.tasks.named('patchBlePeripheral')
        }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
